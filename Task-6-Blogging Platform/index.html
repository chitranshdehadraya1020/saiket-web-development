<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>MyBlog</h1>

    <button onclick="showEditor()">
        + New Post
    </button>

</header>


<main>

    <section id="editor" class="editor">

        <h2>Create Blog Post</h2>

        <input
            type="text"
            id="title"
            placeholder="Post title"
        >

        <textarea
            id="content"
            placeholder="Write your post..."
        ></textarea>

        <button onclick="savePost()">
            Publish Post
        </button>

    </section>


    <section>

        <h2>Latest Posts</h2>

        <div id="posts"></div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
